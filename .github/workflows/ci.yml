name: CI
on:
  push:
    branches: [master, modernize]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore wuh/wuh.csproj
    - name: Build (Release)
      run: dotnet build wuh/wuh.csproj -c Release --no-restore
    - name: Smoke test (--help / --version, no WU API touched)
      run: |
        $exe = "wuh/bin/Release/net8.0-windows/wuh.exe"
        & $exe --help
        & $exe --version
        & $exe show-available --help
