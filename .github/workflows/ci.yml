name: CI
on:
  push:
    branches: [master, modernize]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Setup MSBuild (full framework — needed for COMReference/ResolveComReference)
      uses: microsoft/setup-msbuild@v2
    - name: Restore
      run: dotnet restore wuh/wuh.csproj
    - name: Build (Release, via msbuild.exe so WUApiLib COMReference resolves)
      run: msbuild wuh/wuh.csproj -p:Configuration=Release -p:RestorePackages=false
    - name: Smoke test (--help / --version, no WU API touched)
      run: |
        $exe = "wuh/bin/Release/net8.0-windows/wuh.exe"
        & $exe --help
        & $exe --version
        & $exe show-available --help
