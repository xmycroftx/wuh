name: CD (release)
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Setup MSBuild (full framework — needed for COMReference)
      uses: microsoft/setup-msbuild@v2
    - name: Restore (win-x64)
      run: dotnet restore wuh/wuh.csproj -r win-x64
    - name: Publish (self-contained single-file, via msbuild for COMReference)
      run: >
        msbuild wuh/wuh.csproj -t:Publish
        -p:Configuration=Release
        -p:RuntimeIdentifier=win-x64
        -p:SelfContained=true
        -p:PublishSingleFile=true
        -p:PublishReadyToRun=true
        -p:RestorePackages=false
        -p:PublishDir=publish\
    - name: Smoke test the standalone exe (no runtime installed dependency)
      run: .\wuh\publish\wuh.exe --version
    - name: Zip
      run: Compress-Archive -Path wuh\publish\* -DestinationPath WUH-win-x64.zip
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: WUH-win-x64.zip
        generate_release_notes: true
